[package]
name = "taichiwayfarer"
version = "0.2.0"
edition = "2021"

[dependencies]
axum = { version = "0.8.1", features = ["tokio"] }
chrono = { version = "0.4.39", features = ["serde"] }
markdown = "1.0.0"
maud = { version = "0.27.0", features = ["axum"] }
rss = { version = "2.0.12", features = ["chrono", "serde"] }
tokio = { version = "1.43.0", features = ["rt-multi-thread"] }
tower-http = { version = "0.6.2", features = ["fs", "trace"] }
tower-livereload = "0.10.2"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

[profile.dev]
debug = 0
strip = "debuginfo"

[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1
