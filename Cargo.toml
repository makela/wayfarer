[package]
name = "wayfarer"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Dependencies for the engine and the browser go here
[dependencies]
perseus = { version = "=0.4.2", features = [ "hydrate" ] }
sycamore = "^0.8.1"
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
perseus-tailwind = "0.4.0"
markdown = "0.3.0"
chrono = { version = "0.4.31", features = [ "serde" ] }
log = "0.4.20"

# Engine-only dependencies go here
[target.'cfg(engine)'.dependencies]
tokio = { version = "1", features = [ "macros", "rt", "rt-multi-thread" ] }
perseus-warp = { version = "=0.4.2", features = [ "dflt-server" ] }
warp = { package = "warp-fix-171", version = "0.3" }
diesel = { version = "2.1.4", features = [ "chrono", "postgres", "r2d2" ] }
dotenvy = "0.15.7"

# Browser-only dependencies go here
[target.'cfg(client)'.dependencies]
