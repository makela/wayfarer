[package]
name = "taichiwayfarer"
version = "0.2.0"
edition = "2024"
license = "MIT"
default-run = "taichiwayfarer"

[dependencies]
axum = { version = "0.8.1", features = ["tokio"] }
chrono = { version = "0.4.39", features = ["serde"] }
chrono-tz = "0.10.4"
dotenvy = "0.15.7"
imagesize = "0.15.0"
markdown = "1.0.0"
maud = { version = "0.27.0", features = ["axum"] }
rss = { version = "2.0.12", features = ["atom", "chrono"] }
tokio = { version = "1.43.0", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower-http = { version = "0.7.0", features = ["compression-br", "compression-gzip", "fs", "trace"] }
tower-livereload = "0.10.2"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
unicode-normalization = "0.1.26"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"

# Deny patterns that indicate bugs or incomplete code
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"

# Async safety
await_holding_lock = "deny"
large_futures = "warn"

# Prevent suppressing lints with #[allow(...)]
allow_attributes = "deny"

[lints.rust]
unsafe_code = "deny"

[profile.dev]
debug = 0
strip = "debuginfo"

[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1
